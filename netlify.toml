# Club Ralley Workspace lives in workspace/ of this repo (the SwiftUI app is
# everything else — this doesn't touch it). This tells Netlify to build from
# workspace/ instead of the repo root.
#
# Connect this repo in Netlify (Add new site -> Import from Git) and it picks
# this file up automatically — no "Base directory" UI setting needed.
#
# Environment variables to add in Netlify (Site config -> Environment
# variables) once Club Ralley's own Supabase project exists:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_BOARD_ID

[build]
  base = "workspace"
  command = "npm run build"
  publish = "dist"

# SPA fallback so deep links (/resources/..., /chat/...) work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
